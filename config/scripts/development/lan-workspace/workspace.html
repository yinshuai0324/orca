<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca · 局域网开发</title>
    <link rel="stylesheet" href="./workspace.css" />
    <script defer src="./workspace.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>局域网开发</h1>
        <span id="status" role="status">未连接</span>
      </header>
      <form id="connection">
        <fieldset id="settings">
          <legend>远程 Linux · Codex CLI</legend>
          <div class="row">
            <label>IP 地址<input name="host" placeholder="192.168.1.20" required /></label>
            <label>SSH 用户名<input name="username" autocomplete="username" required /></label>
            <label
              >SSH 密码<input name="password" type="password" autocomplete="off" required
            /></label>
          </div>
          <label for="directory">Mac 项目目录</label>
          <div class="directory">
            <input id="directory" name="directory" placeholder="/Users/you/Projects/app" required />
            <button id="choose" type="button" class="secondary">选取</button>
          </div>
          <p class="share-note">
            远程可读写所选项目的源码。环境文件、Git 元数据、node_modules 和符号链接仅本机可见。
          </p>
          <div class="row local">
            <label>Mac 启动命令<input name="startCommand" value="npm run dev" required /></label>
            <label
              >预览地址<input name="previewUrl" type="url" value="http://127.0.0.1:5173/" required
            /></label>
          </div>
        </fieldset>
        <div class="actions">
          <button id="connect">连接并挂载</button>
          <button id="disconnect" type="button" class="secondary" disabled>断开</button>
          <output id="mount"></output>
        </div>
      </form>
      <p id="error" role="alert" hidden></p>
      <section aria-label="任务输出">
        <div id="messages" role="log" aria-label="Codex 回复"></div>
        <details>
          <summary>Mac 开发服务日志</summary>
          <pre id="logs"></pre>
        </details>
      </section>
      <form id="task">
        <label for="prompt">发给远程 Codex 的任务</label>
        <textarea id="prompt" rows="3" maxlength="32000" required disabled></textarea>
        <button id="send" disabled>发送并自动预览</button>
      </form>
    </main>
  </body>
</html>
